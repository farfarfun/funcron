[project]
name = "funcron"
version = "0.5.8"
description = "基于 Flask 与 Airflow 的定时任务调度管理中心，提供 Web 管理后台及 server/scheduler/worker/flower 等后台服务"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "supervisor>=4.3.0",
    "apscheduler>=3.11.3",
    "gunicorn>=26.2.0",
    "records>=0.6.0",
    "gevent>=26.8.0",
    "redis>=6.4.0",
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-celery>=3.23.1",
    "farlog>=1.1.8",
    "funsecret>=1.4.96",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.1.0",
    "flask-apscheduler>=1.13.1",
    "pymysql>=1.2.0",
    "funbuild>=1.6.75",
    "fundata>=1.0.1",
    "funcoin>=1.0.51",
    "flask-script>=2.0.6",
    "demjson3>=3.0.6",
]

[project.scripts]
funcron = "funcron.server.script:funcron"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funcron"]

[dependency-groups]
dev = ["pytest>=7.0"]
