[project]
name = "funcron"
version = "0.5.9"
description = "基于 Flask 与 Airflow 的定时任务调度管理中心，提供 Web 管理后台及 server/scheduler/worker/flower 等后台服务"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "apscheduler>=3.11.3",
    "gunicorn>=26.2.0",
    "records>=0.6.0",
    "six>=1.17.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.32.0",
    "gevent>=26.8.0",
    "redis>=6.4.0",
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-celery>=3.23.1",
    "farlog>=1.1.8",
    "funsecret>=1.4.96",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.1.0",
    "flask-apscheduler>=1.13.1",
    "pymysql>=1.2.0",
    "fundata>=1.0.3",
    "funcoin>=1.0.51",
]

[project.urls]
Homepage = "https://github.com/farfarfun/funcron"
Repository = "https://github.com/farfarfun/funcron"
Changelog = "https://github.com/farfarfun/funcron/blob/master/CHANGELOG.md"

[project.scripts]
funcron = "funcron.server.script:funcron"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcron"]

[tool.hatch.build.targets.sdist]
include = ["src/funcron", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14.0"]

[tool.ruff]
line-length = 120
target-version = "py310"
# funcron/center/static/ 下是第三方前端资源目录，里面的占位 __init__.py 不参与 lint。
extend-exclude = ["src/funcron/center/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF"]
ignore = [
    # 这些是存量 Flask 代码的既有写法，批量改写风险大于收益，单独排期处理：
    "B008", # 函数默认值里调用函数（Flask 视图层历史写法）
    "RUF001", # 中文注释里的全角标点被判为易混淆字符
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Airflow DAG 文件按 Airflow 约定在模块级构造对象，且依赖运行时注入。
# DTZ001: DAG 的 start_date 用 naive datetime 是 Airflow 的常见写法，时区由
# Airflow 自身的 default_timezone 配置统一解释，这里改成 tz-aware 会改变已有
# DAG 的调度基准时刻。
"src/funcron/airflow/dags/*" = ["E402", "F401", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
